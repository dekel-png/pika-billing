<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
<style>
:root{
  --navy:#12263a; --navy2:#1b3a57; --ink:#22303e; --line:#e3e9ef;
  --bg:#f4f7fa; --card:#ffffff; --accent:#0e7c66; --accent2:#0a5c4c;
  --gold:#b98a2f; --danger:#b3372f; --muted:#6b7a89;
}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:"Segoe UI","Heebo",Arial,sans-serif; background:var(--bg);
     color:var(--ink); min-height:100vh; display:flex; flex-direction:column}
header{background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff;
       padding:14px 22px; display:flex; align-items:center; gap:14px;
       box-shadow:0 2px 10px rgba(18,38,58,.25)}
header .logo{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--navy);
       display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
header h1{font-size:17px; font-weight:700; letter-spacing:.2px}
header .sub{font-size:12px; opacity:.75}
header .spacer{flex:1}
header a{color:#cfe0ee; text-decoration:none; font-size:13px}
main{flex:1; width:100%; max-width:980px; margin:0 auto; padding:26px 18px 60px}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:22px; margin-bottom:18px; box-shadow:0 1px 4px rgba(18,38,58,.05)}
.card h2{font-size:16px; margin-bottom:12px; color:var(--navy)}
.btn{display:inline-block; background:var(--accent); color:#fff; border:none;
     padding:11px 22px; border-radius:9px; font-size:15px; font-weight:600;
     cursor:pointer; text-decoration:none; transition:background .15s}
.btn:hover{background:var(--accent2)}
.btn.secondary{background:#fff; color:var(--navy); border:1.5px solid var(--navy)}
.btn.secondary:hover{background:#eef3f8}
.btn.big{font-size:16px; padding:13px 30px}
table{width:100%; border-collapse:collapse; font-size:14px}
th{background:#f0f4f8; color:var(--navy); text-align:right; padding:9px 10px;
   border-bottom:2px solid var(--line); font-size:13px}
td{padding:9px 10px; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.tag{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600}
.tag.ok{background:#e5f4ef; color:var(--accent2)}
.tag.warn{background:#fbf3e2; color:var(--gold)}
.tag.err{background:#fbe9e7; color:var(--danger)}
.stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.stat{flex:1; min-width:150px; background:var(--card); border:1px solid var(--line);
      border-radius:14px; padding:16px 18px}
.stat .num{font-size:26px; font-weight:800; color:var(--navy)}
.stat .lbl{font-size:12.5px; color:var(--muted); margin-top:3px}
.note{font-size:13px; color:var(--muted); line-height:1.6}
.error-box{background:#fbe9e7; border:1px solid #efc4bf; color:var(--danger);
           border-radius:10px; padding:12px 16px; margin-bottom:14px; font-size:14px}
.ok-box{background:#e5f4ef; border:1px solid #bfe3d6; color:var(--accent2);
        border-radius:10px; padding:12px 16px; margin-bottom:14px; font-size:14px}
input[type=password], input[type=month]{width:100%; padding:11px 13px; font-size:15px;
        border:1.5px solid var(--line); border-radius:9px; font-family:inherit}
input[type=file]{font-size:14px}
input:focus{outline:none; border-color:var(--accent)}
label{font-size:13.5px; font-weight:600; color:var(--navy); display:block; margin-bottom:6px}
.field{margin-bottom:16px}
footer{padding:16px; text-align:center; font-size:12px; color:var(--muted)}
.steps{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 4px}
.step{flex:1; min-width:170px; background:#f0f4f8; border-radius:10px; padding:12px 14px; font-size:13px}
.step b{display:block; color:var(--navy); margin-bottom:3px}
@media (max-width:640px){ main{padding:16px 10px 40px} .card{padding:16px} }
</style>
</head>
<body>
<header>
  <div class="logo">GD</div>
  <div>
    <h1>{{ APP_NAME }}</h1>
    <div class="sub">הפקת חשבוניות ושליחה ללקוחות — ג.ד. פיקה הולדינגס בע"מ</div>
  </div>
  <div class="spacer"></div>
  {% if session.get('role') %}<a href="{{ url_for('dashboard') }}">ראשי</a>
  <a href="{{ url_for('logout') }}">יציאה</a>{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<footer>ג.ד. פיקה הולדינגס בע"מ · המסמכים מופקים בחשבונית ירוקה · גישה מורשית בלבד</footer>
</body>
</html>
