{% extends "base.html" %}
{% block title %}מפיק… — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px; margin:40px auto 0; text-align:center">
  <h2>מפיק חשבוניות לחודש {{ state.month }}…</h2>
  <div style="font-size:40px; margin:18px 0" id="spin">⏳</div>
  <div style="font-size:18px; font-weight:700; color:var(--navy)" id="progress">מתחיל…</div>
  <p class="note" style="margin-top:10px">אפשר להשאיר את הדף פתוח — הוא מתעדכן לבד ועובר לדוח בסיום.</p>
</div>
<script>
const runId = "{{ state.run_id }}";
async function poll(){
  try{
    const r = await fetch("/api/run/" + runId);
    const d = await r.json();
    if (d.status === "finished" || d.status === "failed"){
      window.location = "/report/" + runId; return;
    }
    document.getElementById("progress").textContent =
      "הופקו " + d.done + " מתוך " + d.total + (d.fail ? " · נכשלו " + d.fail : "");
  }catch(e){}
  setTimeout(poll, 1500);
}
poll();
</script>
{% endblock %}
