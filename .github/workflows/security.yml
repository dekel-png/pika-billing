name: security
# Secret scan gate (baseline triaged 11/10/2026 with gitleaks 8.30.1 - the same
# version is pinned below so CI and the triage see identical rules/fingerprints).
#  - pull_request / push: scans the new commits only.
#  - weekly schedule / manual run: scans the FULL history.
# .gitleaksignore holds the triaged baseline, so any hit here is a NEW leak -
# rotate the secret first, then clean up. Never just add it to the ignore file.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 0"   # weekly full-history pass, Sunday 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # gitleaks lists the PR's commits
  issues: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # secrets hide in history, not just in HEAD
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"   # findings go to the job summary, never echoed into PR comments

  alert:
    needs: [gitleaks]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'security', state: 'open'});
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'security scan failed - possible new secret in the repo',
                labels: ['security'],
                body: 'gitleaks went red on ' + context.sha.slice(0, 7) + '.\n\n' +
                      'A NEW secret is in the repo: rotate it first, then rewrite/ignore.\n\n' +
                      'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' +
                      context.repo.repo + '/actions/runs/' + context.runId});
            }
